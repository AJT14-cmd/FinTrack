services:
  db:
    container_name: fintrack
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_password}
      POSTGRES_DB: ${POSTGRES_DB:-fintrack}
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge
volumes:
  db:
