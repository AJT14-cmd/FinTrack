#CCan copy past most of this stuff from project to project

spring.application.name=FinTrack
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5332/fintrack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fintrack_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fintrack_password}
spring.datasource.driver-class-name=org.postgresql.Driver

#refreshes database everytime the application refreshes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
