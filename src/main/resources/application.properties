#Can copy past most of this stuff from project to project

spring.application.name=FinTrack
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5332/fintrack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fintrack_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fintrack_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=3600
jwt.issuer=https://fintrack.local

spring.flyway.enabled=true
